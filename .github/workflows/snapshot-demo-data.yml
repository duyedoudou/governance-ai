name: Snapshot public demo data

on:
  push:
    paths:
      - '.github/workflows/snapshot-demo-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download complete public demo datasets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, datetime, urllib.parse, urllib.request, math

          base='https://rural-governance-agent-demo.netlify.app'
          out=pathlib.Path('data/demo-snapshot-v050')
          out.mkdir(parents=True, exist_ok=True)
          ids=['sys-people','sys-households','sys-pension','sys-welfare','sys-evacuations','sys-expenses','sys-policies']

          def get_json(path, params=None):
              url=base+path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url, headers={'User-Agent':'governance-ai-snapshot/0.5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          status=get_json('/api/status')
          (out/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest={'version':'0.5.0','source':'public Netlify demo API','captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'datasets':{}}
          for asset_id in ids:
              page=1
              requested_limit=200
              first=get_json('/api/reference/asset',{'id':asset_id,'page':page,'limit':requested_limit})
              asset=first.get('asset') or {}
              total=int(first.get('total') or asset.get('record_count') or len(first.get('rows') or []))
              server_limit=int(first.get('limit') or requested_limit)
              rows=list(first.get('rows') or [])
              pages=max(1,math.ceil(total/server_limit))
              for page in range(2,pages+1):
                  d=get_json('/api/reference/asset',{'id':asset_id,'page':page,'limit':server_limit})
                  rows.extend(d.get('rows') or [])
              if len(rows) != total:
                  raise SystemExit(f'{asset_id}: expected {total} rows, captured {len(rows)}')
              normalized={'ok':True,'asset':asset,'rows':rows,'total':total,'page':1,'limit':server_limit,'snapshot_complete':True}
              (out/f'{asset_id}.json').write_text(json.dumps(normalized,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
              manifest['datasets'][asset_id]={'title':asset.get('title'),'rows':len(rows),'fields':asset.get('fields') or []}

          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'README.md').write_text('''# V0.5.0 公开 Demo 数据快照\n\n此目录由当前公开演示站点的只读参考数据 API **分页完整抓取**生成，用于代码仓库中的可复现 Demo 数据备份。\n\n- 仅包含系统内置、公开演示用数据集（`sys-*`）。\n- 不包含管理员运行时上传的源文件、审计日志、访问记录、环境变量或任何私有数据。\n- 这些 Demo 记录仅用于产品测试，不应视为真实村民数据。\n- `manifest.json` 中的行数已与 API 返回的 `total` 校验一致。\n''',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/demo-snapshot-v050
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'data: snapshot complete V0.5.0 public demo datasets'
          git push
