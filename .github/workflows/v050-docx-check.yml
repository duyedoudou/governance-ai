name: V0.5.0 repository check

on:
  push:
    paths:
      - 'netlify/functions/**'
      - 'netlify/database/migrations/**'
      - 'site/**'
      - 'data/demo-snapshot-v050/**'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/v050-docx-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/docx-integration.js
      - name: Bundle main API function
        run: npx --yes esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/api.mjs --external:@netlify/functions --external:@netlify/database --external:@netlify/blobs
      - name: Bundle DOCX function
        run: npx --yes esbuild netlify/functions/docx.mts --bundle --platform=node --format=esm --outfile=/tmp/docx.mjs --external:@netlify/functions --external:@netlify/database --external:@netlify/blobs
      - name: Validate migrations and complete demo snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('netlify/database/migrations').glob('*/migration.sql'):
              b=p.read_bytes()
              b.decode('utf-8')
              assert b'\x00' not in b, p
              print('migration utf8 ok:',p,len(b))
          root=pathlib.Path('data/demo-snapshot-v050')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          for asset_id,meta in manifest['datasets'].items():
              d=json.loads((root/f'{asset_id}.json').read_text(encoding='utf-8'))
              rows=d.get('rows') or []
              total=int(d.get('total') or 0)
              assert d.get('snapshot_complete') is True, asset_id
              assert len(rows)==total==int(meta['rows']), (asset_id,len(rows),total,meta['rows'])
              print('snapshot complete:',asset_id,total)
          PY
      - name: Verify Mammoth can extract a minimal DOCX
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('/tmp/test.docx')
          with zipfile.ZipFile(p,'w') as z:
              z.writestr('[Content_Types].xml','''<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>''')
              z.writestr('_rels/.rels','''<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>''')
              z.writestr('word/document.xml','''<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>黄林坑村 DOCX 正文解析测试成功</w:t></w:r></w:p><w:sectPr/></w:body></w:document>''')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const mammoth=require('mammoth');
          mammoth.extractRawText({buffer:fs.readFileSync('/tmp/test.docx')}).then(r=>{
            if(!r.value.includes('黄林坑村 DOCX 正文解析测试成功')) process.exit(1);
            console.log(r.value.trim());
          }).catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Prepare deploy source
        run: |
          rm -rf /tmp/governance-ai-source
          mkdir -p /tmp/governance-ai-source
          rsync -a --exclude '.git' --exclude 'node_modules' ./ /tmp/governance-ai-source/
      - name: Upload deploy source artifact
        uses: actions/upload-artifact@v4
        with:
          name: governance-ai-v050-source
          path: /tmp/governance-ai-source
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
      NETLIFY_SITE_ID: 89dfa228-952e-4712-8a99-9344cb0ea5fd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Netlify deployment credential
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Netlify credential is configured."
          else
            echo "Netlify credential is not configured; deployment step will be skipped."
          fi
      - name: Deploy production to existing Netlify site
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli@latest deploy --prod --build --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
