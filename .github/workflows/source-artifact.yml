name: Package current source

on:
  push:
    paths:
      - '.github/workflows/source-artifact.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: governance-ai-current-source
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1

