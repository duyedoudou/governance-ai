name: Conversation routing compatibility check

on:
  push:
    paths:
      - 'netlify/edge-functions/**'
      - 'netlify/functions/agent-v053.mts'
      - 'site/intent-ui.js'
      - 'site/index.html'
      - 'site/assets/ai-village-chief.png'
      - 'site/assets/ai-village-chief-fallback.png'
      - 'package.json'
      - '.github/workflows/v051-intent-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check browser JavaScript syntax
        run: |
          node --check site/intent-ui.js
          node --check site/docx-integration.js
      - name: Bundle current conversation edge function
        run: npx --yes esbuild netlify/edge-functions/intent-router.ts --bundle --platform=neutral --format=esm --outfile=/tmp/intent-router.mjs --external:@netlify/edge-functions
      - name: Bundle Agent function
        run: npx --yes esbuild netlify/functions/agent-v053.mts --bundle --platform=node --format=esm --outfile=/tmp/agent-v053.mjs --external:@netlify/functions --external:@netlify/database
      - name: Semantic routing and avatar assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edge=Path('netlify/edge-functions/intent-router.ts').read_text(encoding='utf-8')
          agent=Path('netlify/functions/agent-v053.mts').read_text(encoding='utf-8')
          html=Path('site/index.html').read_text(encoding='utf-8')
          ui=Path('site/intent-ui.js').read_text(encoding='utf-8')

          for x in ['/api/query','/api/reference/document/query','/api/status','/api/agent-v053']:
              assert x in edge, x

          # Routing must be semantic, not a phrase whitelist/regex catalog.
          assert 'semanticRoute' in edge
          assert 'semantic-tool-gate' in edge
          assert '如果不确定，优先 conversation' in edge
          assert 'isSelfIntro' not in edge
          assert 'isDirectChat' not in edge
          assert 'selfIntroResponse' not in edge
          assert '介绍你自己' not in edge
          assert '来聊天' not in edge

          # General responses remain possible before database initialization.
          general_pos=agent.find("p.tools[0]?.tool==='general_response'")
          db_pos=agent.find('db=safeDb()')
          assert general_pos >= 0 and db_pos >= 0 and general_pos < db_pos
          assert 'const db=getDatabase()' not in agent

          # Avatar keeps a real independent fallback asset.
          assert Path('site/assets/ai-village-chief.png').is_file()
          assert Path('site/assets/ai-village-chief-fallback.png').is_file()
          assert Path('site/assets/ai-village-chief.png').stat().st_size > 7000
          assert Path('site/assets/ai-village-chief-fallback.png').stat().st_size > 7000
          assert '/assets/ai-village-chief.png?v=0533' in ui
          assert '/assets/ai-village-chief-fallback.png?v=0533' in ui
          assert 'intent-ui.js?v=0533' in html
          print('Semantic routing architecture assertions passed')
          PY
