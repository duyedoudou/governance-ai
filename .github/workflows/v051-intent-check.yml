name: Intent routing compatibility check

on:
  push:
    paths:
      - 'netlify/edge-functions/**'
      - 'site/intent-ui.js'
      - 'site/index.html'
      - 'package.json'
      - '.github/workflows/v051-intent-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check browser JavaScript syntax
        run: |
          node --check site/intent-ui.js
          node --check site/docx-integration.js
      - name: Bundle current intent edge function
        run: npx --yes esbuild netlify/edge-functions/intent-router.ts --bundle --platform=neutral --format=esm --outfile=/tmp/intent-router.mjs --external:@netlify/edge-functions
      - name: Static routing assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('netlify/edge-functions/intent-router.ts').read_text(encoding='utf-8')
          html=Path('site/index.html').read_text(encoding='utf-8')
          for x in ['chat','system_help','governance_query','document_query','clarify','/api/query','/api/reference/document/query','/api/status']:
              assert x in s, x
          assert '<script src="./intent-ui.js"></script>' in html
          # V0.5.2 governance work must route away from the legacy regex query path.
          if '0.5.2' in s:
              assert '/api/query-v052-exec' in s
              assert 'queryspec-v052' in s
          print('intent routing compatibility assertions passed')
          PY
