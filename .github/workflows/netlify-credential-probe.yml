name: Netlify credential probe

on:
  push:
    paths:
      - '.github/workflows/netlify-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_B: ${{ secrets.NETLIFY_TOKEN }}
      TOKEN_C: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Report credential availability without revealing values
        run: |
          if [ -n "$TOKEN_A" ]; then echo "NETLIFY_AUTH_TOKEN=available"; else echo "NETLIFY_AUTH_TOKEN=missing"; fi
          if [ -n "$TOKEN_B" ]; then echo "NETLIFY_TOKEN=available"; else echo "NETLIFY_TOKEN=missing"; fi
          if [ -n "$TOKEN_C" ]; then echo "NETLIFY_PERSONAL_ACCESS_TOKEN=available"; else echo "NETLIFY_PERSONAL_ACCESS_TOKEN=missing"; fi
