# diagnostic: locate corrupt bootstrap chunk before V0.5.0 DOCX parser work
name: Bootstrap project source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose bootstrap chunks
        shell: bash
        run: |
          set -euo pipefail
          echo '--- sizes / sha256 ---'
          wc -c .bootstrap/part-*
          sha256sum .bootstrap/part-*
          echo '--- compare original 03 vs split 03 ---'
          cat .bootstrap/part-03a .bootstrap/part-03b .bootstrap/part-03c .bootstrap/part-03d > /tmp/part03-split
          wc -c .bootstrap/part-03 /tmp/part03-split
          sha256sum .bootstrap/part-03 /tmp/part03-split
          cmp -l .bootstrap/part-03 /tmp/part03-split | head -20 || true
          echo '--- test main variants ---'
          for mode in original split; do
            if [ "$mode" = original ]; then middle='.bootstrap/part-03'; else middle='/tmp/part03-split'; fi
            cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 "$middle" .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 > "/tmp/$mode.b64"
            base64 -d "/tmp/$mode.b64" > "/tmp/$mode.tar.xz"
            echo "$mode decoded bytes: $(wc -c < /tmp/$mode.tar.xz)"
            xz -t "/tmp/$mode.tar.xz" && echo "$mode OK" || echo "$mode BAD"
          done
