# salvage V0.4.9 core source and commit recovered complete files
name: Bootstrap project source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover complete V0.4.9 core files
        shell: bash
        run: |
          set -u
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 > /tmp/core.b64
          base64 -d /tmp/core.b64 > /tmp/core.tar.xz
          mkdir -p /tmp/recover
          xz -dc /tmp/core.tar.xz > /tmp/core.tar 2>/dev/null || true
          tar -xf /tmp/core.tar -C /tmp/recover 2>/dev/null || true
          test -s /tmp/recover/site/index.html
          test -s /tmp/recover/site/app.js
          test -s /tmp/recover/site/styles.css
          test -s /tmp/recover/netlify/functions/api.mts
          mkdir -p site netlify/functions
          cp /tmp/recover/site/index.html site/index.html
          cp /tmp/recover/site/app.js site/app.js
          cp /tmp/recover/site/styles.css site/styles.css
          cp /tmp/recover/netlify/functions/api.mts netlify/functions/api.mts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/app.js site/styles.css netlify/functions/api.mts
          git commit -m "fix: recover V0.4.9 core application source"
          git push
