# retrigger: 2026-09-04 DOCX parser work, use verified split segment 03a-03d
name: Bootstrap project source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V0.4.9 source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03a .bootstrap/part-03b .bootstrap/part-03c .bootstrap/part-03d .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 > /tmp/core.b64
          base64 -d /tmp/core.b64 > /tmp/core.tar.xz
          xz -t /tmp/core.tar.xz
          tar -xJf /tmp/core.tar.xz -C .
          test -f site/index.html
          test -f site/app.js
          test -f site/styles.css
          test -f netlify/functions/api.mts
          test -f netlify/database/migrations/004_dataset-versioning/migration.sql
          test -f site/assets/ai-village-chief.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site netlify package.json netlify.toml deploy-macos.command
          git commit -m "feat: restore V0.4.9 application source"
          git push
