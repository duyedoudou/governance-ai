# salvage diagnostic: recover complete files before xz corruption
name: Bootstrap project source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvage bootstrap archive
        shell: bash
        run: |
          set -u
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 > /tmp/core.b64
          base64 -d /tmp/core.b64 > /tmp/core.tar.xz
          mkdir -p /tmp/recover
          xz -dc /tmp/core.tar.xz > /tmp/core.tar 2>/tmp/xz.err || true
          echo "partial tar bytes: $(wc -c < /tmp/core.tar)"
          cat /tmp/xz.err || true
          tar -xvf /tmp/core.tar -C /tmp/recover 2>/tmp/tar.err || true
          echo '--- recovered files ---'
          find /tmp/recover -type f -printf '%P %s bytes\n' | sort
          echo '--- tar error ---'
          cat /tmp/tar.err || true
          echo '--- key files ---'
          for f in site/index.html site/app.js site/styles.css netlify/functions/api.mts netlify/database/migrations/004_dataset-versioning/migration.sql; do
            if [ -f "/tmp/recover/$f" ]; then echo "FOUND $f $(wc -c < /tmp/recover/$f)"; else echo "MISSING $f"; fi
          done
